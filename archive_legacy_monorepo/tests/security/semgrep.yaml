# Semgrep rules — ANGKOR EYES security gate.
# Run:  semgrep --config tests/security/semgrep.yaml backend/ bot/ runner/ frontend/
#        (or: npm run test:security — from tests/)
# CI must FAIL on any finding. Tune a rule only by narrowing its pattern
# and recording why in a comment — never by deleting a rule silently.
rules:
  # ---------------------------------------------------------------------------
  # 1. Prompt injection — never treat tool / web / file content as instructions
  # ---------------------------------------------------------------------------
  - id: angkor.prompt-injection-system-prompt-concat
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Tool output, file content, or web content must never be concatenated
      into a system prompt or an instruction field. Treat it as data:
      pass it as a quoted `data` / `content` argument, never as instructions.
      See docs/security.md (prompt injection).
    patterns:
      - pattern-either:
          - pattern: |
              $PROMPT = $PROMPT + $TOOL_OUTPUT
          - pattern: |
              `...${$TOOL_OUTPUT}...`
          - pattern: |
              system: $X + $TOOL_OUTPUT
    metadata:
      category: security
      confidence: MEDIUM

  - id: angkor.prompt-injection-eval-of-agent-output
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Never eval() / Function() agent output, tool output, or user input.
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function($X)
          - pattern: $X.constructor($Y)
    metadata:
      category: security
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # 2. Path traversal — file tools must stay inside the jail
  # ---------------------------------------------------------------------------
  - id: angkor.path-traversal-readfile
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      File path from user/agent input is used without a jail check.
      Resolve against RUNNER_REPO_PATH / the worktree dir and reject any
      path that escapes it (including `..`). See docs/architecture.md §7.
    patterns:
      - pattern-either:
          - pattern: fs.readFileSync($PATH, ...)
          - pattern: fs.promises.readFile($PATH, ...)
          - pattern: fs.createReadStream($PATH, ...)
    metadata:
      category: security
      confidence: MEDIUM

  - id: angkor.path-traversal-writefile
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      File write from user/agent input without a jail check. Same rule as
      readfile: resolve + reject escapes before writing.
    patterns:
      - pattern-either:
          - pattern: fs.writeFileSync($PATH, ...)
          - pattern: fs.promises.writeFile($PATH, ...)
          - pattern: fs.createWriteStream($PATH, ...)
    metadata:
      category: security
      confidence: MEDIUM

  # ---------------------------------------------------------------------------
  # 3. SSRF — agent-fetched URLs must not reach private networks
  # ---------------------------------------------------------------------------
  - id: angkor.ssrf-fetch-user-url
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      fetch() / axios / http.get with a user- or agent-supplied URL must go
      through the SSRF guard (allowlist + private-IP / metadata-IP block:
      169.254.169.254, 10/8, 172.16/12, 192.168/16, ::1). Direct fetch of
      an unvalidated URL is SSRF. See docs/security.md.
    patterns:
      - pattern-either:
          - pattern: fetch($URL, ...)
          - pattern: axios.get($URL, ...)
          - pattern: axios($URL, ...)
          - pattern: http.get($URL, ...)
          - pattern: https.get($URL, ...)
    metadata:
      category: security
      confidence: MEDIUM

  # ---------------------------------------------------------------------------
  # 4. Shell injection — never interpolate input into a shell string
  # ---------------------------------------------------------------------------
  - id: angkor.shell-injection-exec
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      child_process.exec / execSync with interpolated input is shell
      injection. Use execFile/spawn with an argv array, plus the runner's
      command allowlist and directory jail.
    patterns:
      - pattern-either:
          - pattern: exec($CMD, ...)
          - pattern: execSync($CMD, ...)
    metadata:
      category: security
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # 5. Secrets — never hardcode, log, or send them
  # ---------------------------------------------------------------------------
  - id: angkor.hardcoded-telegram-token
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A value that looks like a Telegram bot token is hardcoded. Tokens
      come from TELEGRAM_BOT_TOKEN in .env only. Rotate the token if this
      value was ever real.
    patterns:
      - pattern-regex: "[0-9]{8,10}:[A-Za-z0-9_-]{35}"
    metadata:
      category: security
      confidence: HIGH

  - id: angkor.secret-in-log
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Do not log values named token / secret / api key / password. Logs
      are shipped to Sentry/Grafana; a secret in a log is a leak.
    patterns:
      - pattern-either:
          - pattern: console.log(..., $TOKEN, ...)
          - pattern: logger.info(..., $TOKEN, ...)
          - pattern: logger.info($MSG + $TOKEN)
    metavariables:
      - metavariable: $TOKEN
        patterns:
          - pattern-regex: "(?i)(token|secret|api[_-]?key|password)"
    metadata:
      category: security
      confidence: MEDIUM

  # ---------------------------------------------------------------------------
  # 6. Approval bypass — risky tools must go through the gate
  # ---------------------------------------------------------------------------
  - id: angkor.approval-bypass-direct-tool-exec
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A high/critical tool (merge, deploy, shell, spend, delete) is invoked
      without going through the approval gate. All such calls must pass
      RiskClassifier + requireApproval() first. See docs/architecture.md §4.
    patterns:
      - pattern-either:
          - pattern: mergeWorktree(...)
          - pattern: runShellCommand(...)
          - pattern: deleteData(...)
    metadata:
      category: security
      confidence: LOW
