name: angkor-eyes

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: angkor-eyes-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  runner:
    profiles:
      - runner
    build:
      context: .
      dockerfile: docker/Dockerfile.runner
    container_name: angkor-eyes-runner
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      RUNNER_BACKEND_URL: ws://backend:3000/runner-ws
      RUNNER_TOKEN: ${RUNNER_TOKEN:-angkor-runner-token-secure-key}
    volumes:
      - ./worktrees:/app/worktrees
